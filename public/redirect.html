<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening C2 Club...</title>
    <style>
        body, html {
            height: 100%; margin: 0; display: flex;
            justify-content: center; align-items: center;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            flex-direction: column;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #39FF14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text { font-size: 16px; font-weight: 500; }
        .fallback-btn {
            margin-top: 30px; padding: 10px 20px;
            background: #39FF14; color: #000;
            text-decoration: none; border-radius: 8px;
            font-weight: bold; display: none;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div class="text">Opening C2 Club...</div>
    <a id="fallbackBtn" class="fallback-btn" href="https://play.google.com/store/apps/details?id=com.c2club.uniqueapp">Go to Play Store</a>

    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isAndroid = ua.indexOf("android") > -1;
            var isIOS = /ipad|iphone|ipod/.test(ua) && !window.MSStream;
            
            // Get referral code
            function getReferralCode() {
                var code = null;
                var params = new URLSearchParams(window.location.search);
                if (params.has('ref')) {
                    code = params.get('ref');
                } else {
                    var segments = window.location.pathname.split('/');
                    var refIndex = segments.indexOf('ref');
                    if (refIndex !== -1 && segments.length > refIndex + 1) {
                        code = segments[refIndex + 1];
                    }
                }
                return code ? code.trim() : null;
            }

            var refCode = getReferralCode();
            var playStoreBase = "https://play.google.com/store/apps/details?id=com.c2club.uniqueapp";
            var playStoreUrl = playStoreBase;
            if (refCode) {
                // Encode the referral code accurately for Play Store referrer param
                playStoreUrl += "&referrer=ref%3D" + encodeURIComponent(refCode);
            }

            // --- CHALLENGE FALLBACK LOGIC ---
            var fallbackUrl = playStoreUrl;
            var path = window.location.pathname; 
            var isChallenge = path.indexOf('/challenge/') > -1;
            
            if (isChallenge) {
                // For challenges, fallback to the website display page instead of Play Store
                // We add no_redirect=true to prevent loop if challenge.html uses deeplink-fallback.js
                fallbackUrl = window.location.origin + "/challenge-view.html?id=" + path.split('/challenge/')[1] + "&no_redirect=true";
                if (refCode) fallbackUrl += "&ref=" + encodeURIComponent(refCode);
            }
            // ---------------------------------

            // Path tracking to rebuild intent
            var search = window.location.search; 
            var fullPath = path + search; 

            if (isAndroid) {
                var intentUrl = "intent://c2club.in" + fullPath + "#Intent;" +
                                "scheme=https;" +
                                "package=com.c2club.uniqueapp;" +
                                "S.browser_fallback_url=" + encodeURIComponent(fallbackUrl) + ";" +
                                "end;";

                window.location.replace(intentUrl);
                
                setTimeout(function() {
                    document.getElementById('fallbackBtn').href = fallbackUrl;
                    document.getElementById('fallbackBtn').style.display = 'block';
                    document.querySelector('.text').innerText = "If nothing happens, tap below.";
                }, 3000);
            } else if (isIOS) {
                document.querySelector('.text').innerText = "C2 Club is coming soon to iOS!";
            } else {
                window.location.replace("/" + search);
            }
        })();
    </script>
</body>
</html>
