<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Is this you? | C2 Club</title>
<meta name="description" content="Scan, match your campus personality, and meet the students who are just like you.">
<meta name="theme-color" content="#0A9F6C" id="themeColor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A9F6C;      /* emerald */
    --deep: #067A53;    /* emerald, one step darker (halo + dots) */
    --ink: #052E22;     /* forest */
    --mint: #E2FCEF;    /* light surface */
    --sun: #FFC83D;     /* marigold, the one warm accent for actions */
    --card: #2F6BFF;
    --ct: #ffffff;
    --display: "Bowlby One", "Arial Black", Impact, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--deep) 1.8px, transparent 2px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--body);
    font-weight: 500;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  .screen { display: none; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px 20px 28px; text-align: center; }
  .screen.on { display: flex; }

  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 7.4vw, 2.5rem); line-height: 1.08; max-width: 14em; text-wrap: balance; }
  .sub { font-weight: 800; font-size: 1.15rem; margin-top: 14px; }

  /* ---- the sticker card ---- */
  .card {
    --w: min(70vw, 280px);
    width: var(--w); aspect-ratio: 60 / 91; flex: none;
    background: var(--card); color: var(--ct);
    border: 12px solid #fff; border-radius: 26px;
    box-shadow: 0 10px 0 rgba(4,40,28,.28), 0 18px 30px rgba(4,40,28,.25);
    display: flex; flex-direction: column; padding: 10px 10px 8px; text-align: left; position: relative; overflow: hidden;
  }
  .card.dark { border-color: var(--glow); box-shadow: 0 0 0 3px #0a0a14, 0 0 22px var(--glow), 0 0 46px var(--glow); }
  .card .nm { font-family: var(--display); font-size: clamp(1.05rem, 5.2vw, 1.4rem); line-height: 1.05; }
  .card .art { flex: 1; margin: 8px 0; border-radius: 14px; background: rgba(255,255,255,.2); background: color-mix(in srgb, var(--ct) 14%, transparent); position: relative; display: grid; place-items: center; overflow: hidden; }
  .card .art .em { font-size: clamp(3.4rem, 17vw, 5.4rem); }
  .card .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .st { font-weight: 800; font-size: .8rem; line-height: 1.25; }
  .card .ft { margin-top: 6px; font-weight: 800; font-size: .66rem; opacity: .85; }

  #revealCard { position: relative; display: grid; place-items: center; margin: 22px 0 6px; }
  #revealCard::before { content: ""; position: absolute; width: min(92vw, 380px); aspect-ratio: 1; border-radius: 50%; background: var(--deep); box-shadow: 0 0 0 10px rgba(5,46,34,.12); }
  #reveal .card { position: relative; z-index: 1; transform: rotate(-3deg); animation: slap .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes slap { from { transform: scale(1.35) rotate(-9deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }

  /* ---- buttons ---- */
  .row { display: flex; flex-direction: column; gap: 12px; width: min(100%, 340px); margin-top: 22px; }
  .btn {
    font: 800 1.05rem/1 var(--body); cursor: pointer; padding: 16px 18px; border-radius: 16px;
    border: 3px solid var(--ink); background: #fff; color: var(--ink);
    box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn.ghost:active { transform: none; opacity: .7; }
  .btn.pri { background: var(--sun); color: var(--ink); }
  :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

  /* ---- swipe screen ---- */
  #pick { justify-content: flex-start; padding-left: 0; padding-right: 0; }
  #pick h1 { padding: 18px 20px 0; font-size: clamp(1.5rem, 6.4vw, 2.1rem); }
  .back { align-self: flex-start; margin: 10px 14px 0; }
  .track { display: flex; gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; padding: 26px calc(50vw - var(--hw, 140px)) 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .slide { scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; flex: none; }
  .slide .btn { width: min(70vw, 280px); }
  .hint { font-weight: 700; font-size: .9rem; margin-top: 10px; opacity: .8; }

  /* ---- join sheet ---- */
  dialog { border: 0; padding: 0; background: transparent; max-width: none; width: 100%; margin: auto 0 0; color: var(--ink); }
  dialog::backdrop { background: rgba(4,40,28,.55); }
  .sheet { background: var(--mint); border-radius: 28px 28px 0 0; padding: 26px 22px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; border-top: 4px solid var(--ink); animation: up .3s ease-out both; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.1; text-wrap: balance; }
  .sheet p { margin: 10px auto 0; max-width: 24em; font-weight: 700; }
  .sheet .row { margin: 20px auto 0; }
  .note { font-size: .85rem; font-weight: 700; margin-top: 14px; opacity: .75; }

  @media (min-width: 700px) {
    dialog { max-width: 460px; margin: auto; }
    .sheet { border-radius: 28px; border: 4px solid var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .track { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<main>
  <section class="screen on" id="reveal" aria-live="polite">
    <h1 id="revealTitle"></h1>
    <div id="revealCard"></div>
    <p class="sub">Accurate or not?</p>
    <div class="row">
      <button class="btn pri" id="yes">Yes, that's me</button>
      <button class="btn ghost" id="nah">Nah, show me another</button>
    </div>
  </section>

  <section class="screen" id="pick">
    <button class="btn ghost back" id="back">Back</button>
    <h1>No worries. Swipe till one hits.</h1>
    <div class="track" id="track" tabindex="0" aria-label="Personality cards"></div>
    <p class="hint">Swipe sideways for more cards</p>
  </section>
</main>

<dialog id="join" aria-labelledby="joinTitle">
  <div class="sheet">
    <h2 id="joinTitle"></h2>
    <p id="joinSub"></p>
    <div class="row">
      <a class="btn pri" id="joinBtn" style="text-decoration:none;display:block" rel="noopener"></a>
      <button class="btn ghost" id="notNow">Not now</button>
    </div>
    <p class="note" id="joinNote" hidden>C2 Club is on Android for now. Open this page on your phone to join.</p>
  </div>
</dialog>

<script>
/* ============ CONFIG ============ */
const APP_ID = "com.c2club.uniqueapp";
const ART_PATH = "/card-art/";
const COUNTS_URL = "https://firestore.googleapis.com/v1/projects/c2club-fd6722/databases/(default)/documents/public_stats/card_counts";
let counts = {};
const MIN_FOR_SOCIAL_PROOF = 25;
/* ================================= */

const ARCH = [
  { slug:"social-butterfly", name:"Social Butterfly", pl:"Social Butterflies", a:"a", em:"🦋", card:"#D3C2FF", t:"#052E22", stat:"Knows everyone. Remembers nobody's exam date." },
  { slug:"topper", name:"Topper", pl:"Toppers", a:"a", em:"📚", card:"#FFC83D", t:"#052E22", stat:"Notes: 100%. Sleep: 0%." },
  { slug:"canteen-commander", name:"Canteen Commander", pl:"Canteen Commanders", a:"a", em:"🍟", card:"#FF8A2B", t:"#052E22", stat:"Attendance: canteen. Marks: pending." },
  { slug:"3am-debugger", name:"3AM Debugger", pl:"3AM Debuggers", a:"a", em:"🐛", card:"#052E22", t:"#C6F432", glow:"#C6F432", dark:true, stat:"Fixed a bug at 3:07 AM. Made two more." },
  { slug:"professors-favorite", name:"Professor's Favorite", pl:"Professor's Favorites", a:"a", em:"🍎", card:"#BFF5DC", t:"#052E22", stat:"Sir said 'good' once. Still living on it." },
  { slug:"last-bench-strategist", name:"Last Bench Strategist", pl:"Last Bench Strategists", a:"a", em:"♟️", card:"#12A39A", t:"#052E22", stat:"Plans everything. Sits farthest from the board." },
  { slug:"campus-politician", name:"Campus Politician", pl:"Campus Politicians", a:"a", em:"📢", card:"#C6F432", t:"#052E22", stat:"Knows a guy. The guy knows a guy." },
  { slug:"attendance-calculator", name:"Attendance Calculator", pl:"Attendance Calculators", a:"an", em:"🧮", card:"#FFEE8C", t:"#052E22", stat:"74.9%. Praying for 75." },
  { slug:"silent-genius", name:"Silent Genius", pl:"Silent Geniuses", a:"a", em:"🧠", card:"#06303A", t:"#5CF0E0", glow:"#5CF0E0", dark:true, stat:"Says nothing. Scores everything." },
  { slug:"assignment-survivor", name:"Assignment Survivor", pl:"Assignment Survivors", a:"an", em:"⏰", card:"#E23D35", t:"#FFFFFF", stat:"Starts at 11 PM. Submits at 11:59." },
  { slug:"campus-influencer", name:"Campus Influencer", pl:"Campus Influencers", a:"a", em:"📸", card:"#FF7EB6", t:"#052E22", stat:"4,000 reels in the gallery. Zero lecture notes." },
  { slug:"all-rounder", name:"All Rounder", pl:"All Rounders", a:"an", em:"🏏", card:"#8FDBFF", t:"#052E22", stat:"Quiz, cricket, cultural fest. Sleeps on the bus." }
];
const BY = Object.fromEntries(ARCH.map(a => [a.slug, a]));
const $ = id => document.getElementById(id);

function slugFromUrl() {
  const q = new URLSearchParams(location.search).get("card");
  const seg = location.pathname.split("/").filter(Boolean).pop() || "";
  const s = (q || seg).toLowerCase().replace(/\.html$/, "");
  return BY[s] ? s : "topper";
}

function track(name, props) {
  try { if (window.gtag) gtag("event", name, props || {}); else if (window.plausible) plausible(name, { props }); } catch (e) {}
  if (location.hostname === "localhost") console.log("[track]", name, props || {});
}

function theme(a) { /* page stays emerald; only the cards change colour */ }

function cardHTML(a) {
  return `<article class="card ${a.dark ? "dark" : ""}" style="--card:${a.card};--ct:${a.t};${a.glow ? "--glow:" + a.glow : ""}">
    <div class="nm">${a.name}</div>
    <div class="art"><span class="em" aria-hidden="true">${a.em}</span>
      <img src="${ART_PATH}${a.slug}.png" alt="" onerror="this.remove()"></div>
    <div class="st">${a.stat}</div>
    <div class="ft">C2 Club</div>
  </article>`;
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}

let chosen = slugFromUrl();

function renderReveal() {
  const a = BY[chosen];
  theme(a);
  $("revealTitle").textContent = `This card says you're ${a.a} ${a.name}.`;
  $("revealCard").innerHTML = cardHTML(a);
  document.title = `${a.name}? Is this you? | C2 Club`;
}

function playUrl(slug) {
  const params = new URLSearchParams(location.search);
  const c = params.get("c");
  const referrer = `card=${slug}&s=qr${c ? `&c=${encodeURIComponent(c)}` : ""}`;
  return `https://play.google.com/store/apps/details?id=${APP_ID}&referrer=${encodeURIComponent(referrer)}`;
}

function openJoin(a) {
  const n = Number(counts[a.slug] || 0);
  const proof = n >= MIN_FOR_SOCIAL_PROOF;
  $("joinTitle").textContent = proof ? `${n} ${a.pl} are already inside.` : `Be one of the first ${a.pl} in C2 Club.`;
  $("joinSub").textContent = proof ? `They're waiting in the ${a.name} Club. Go say hi.` : `The ${a.name} Club is just starting. Walk in early and shape it.`;
  
  const b = $("joinBtn");
  const isAndroid = /android/i.test(navigator.userAgent);

  if (isAndroid) {
    b.textContent = `Join the ${a.pl}`;
    // FIX 1: Set direct Play Store referral URL without re-navigating to current page
    b.href = playUrl(a.slug);
    b.onclick = () => {
      track("join_click", { card: a.slug });
      try { localStorage.setItem("c2_card", a.slug); } catch (e) {}
    };
  } else {
    // Desktop / iOS non-Android fallback: WhatsApp share
    b.textContent = "Send this to my phone";
    const pageUrl = window.location.href;
    const waText = encodeURIComponent(`Check out the ${a.name} Club on C2 Club! ${pageUrl}`);
    b.href = `https://wa.me/?text=${waText}`;
    b.onclick = () => {
      track("join_click_whatsapp", { card: a.slug });
    };
  }

  $("joinNote").hidden = isAndroid;
  theme(a);
  const d = $("join");
  if (!d.open) d.showModal();
  track("join_open", { card: a.slug, social_proof: proof });
}

function renderPick() {
  const start = ARCH.findIndex(a => a.slug === chosen);
  const order = ARCH.slice(start + 1).concat(ARCH.slice(0, start));
  $("track").innerHTML = order.map(a => `<div class="slide" data-slug="${a.slug}">${cardHTML(a)}<button class="btn pri" data-pick="${a.slug}">This is me</button></div>`).join("");
  const hw = Math.min(window.innerWidth * 0.7, 280) / 2;
  $("track").style.setProperty("--hw", hw + "px");
  $("track").scrollLeft = 0;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) theme(BY[e.target.dataset.slug]); }), { root: $("track"), threshold: 0.6 });
  document.querySelectorAll(".slide").forEach(s => io.observe(s));
}

$("yes").onclick = () => { track("confirm_yes", { card: chosen }); openJoin(BY[chosen]); };
$("nah").onclick = () => { track("confirm_no", { card: chosen }); renderPick(); show("pick"); };
$("back").onclick = () => { renderReveal(); show("reveal"); };
$("notNow").onclick = () => $("join").close();
$("join").addEventListener("click", e => { if (e.target === $("join")) $("join").close(); });
$("track").addEventListener("click", e => {
  const slug = e.target.dataset && e.target.dataset.pick;
  if (!slug) return;
  chosen = slug;
  history.replaceState(null, "", "?card=" + slug);
  track("swipe_pick", { card: slug });
  openJoin(BY[slug]);
});

(async function init() {
  // FIX 2: Correctly parse Firestore REST API typed JSON { fields: { <slug>: { integerValue: "12" } } }
  if (COUNTS_URL) {
    try {
      const res = await fetch(COUNTS_URL);
      if (res.ok) {
        const j = await res.json();
        counts = Object.fromEntries(
          Object.entries(j.fields || {}).map(([k, v]) => [k, Number(v.integerValue || 0)])
        );
      }
    } catch (e) {
      console.warn("Could not fetch counts:", e);
    }
  }
  renderReveal();
  track("scan", { card: chosen });
})();
</script>
</body>
</html>
