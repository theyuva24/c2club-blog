<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge | C2 Club</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <!-- SEO / Social Meta Tags -->
    <meta property="og:title" content="Join the Challenge on C2 Club">
    <meta property="og:description" content="Check out this challenge on C2 Club - The student collaboration platform.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://c2club.in/preview.jpg">

    <link rel="stylesheet" href="/style.css">
    <script src="/deeplink-fallback.js" defer></script>

    <style>
        :root {
            --app-bg: #050505;
            --app-surface: #121212;
            --app-surface-light: #1c1c1c;
            --app-accent: #39FF14;
            --app-accent-glow: rgba(57, 255, 20, 0.3);
            --app-text: #ffffff;
            --app-text-dim: rgba(255, 255, 255, 0.7);
            --app-text-very-dim: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--app-bg);
            color: var(--app-text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* --- Header & Banner --- */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 300px;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.05);
            filter: brightness(0.8);
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.6) 0%, 
                transparent 30%, 
                rgba(5,5,5,0.8) 70%, 
                rgba(5,5,5,1) 100%);
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn:hover {
            background: var(--app-accent);
            color: black;
            transform: scale(1.1);
        }

        /* --- Main Content --- */
        .content-wrapper {
            position: relative;
            max-width: 800px;
            margin: -60px auto 0;
            padding: 0 15px 120px;
            z-index: 10;
        }

        .main-card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header-info {
            text-align: left;
            margin-bottom: 24px;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-accent {
            background: var(--app-accent-glow);
            color: var(--app-accent);
            border: 1px solid rgba(57, 255, 20, 0.2);
        }

        .badge-glass {
            background: var(--glass-bg);
            color: var(--app-text-dim);
            border: 1px solid var(--glass-border);
        }

        .challenge-title {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            margin: 0 0 12px;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .challenge-tagline {
            font-size: 16px;
            color: var(--app-text-dim);
            font-weight: 400;
            max-width: 100%;
        }

        /* --- Stats & Timer --- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            background: var(--app-surface-light);
            padding: 16px 20px;
            border-radius: 20px;
            margin-bottom: 32px;
            align-items: center;
        }

        .timer-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timer-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--app-accent);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .timer-values {
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .time-unit {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .time-val {
            font-size: 28px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--app-text-very-dim);
        }

        /* --- Prizes --- */
        .prize-section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-header h3 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
        }

        .prizes-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .prize-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .prize-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.15);
        }

        .prize-rank {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .rank-1 { background: rgba(255, 215, 0, 0.1); color: #FFD700; }
        .rank-2 { background: rgba(192, 192, 192, 0.1); color: #C0C0C0; }
        .rank-3 { background: rgba(205, 127, 50, 0.1); color: #CD7F32; }
        .rank-other { background: var(--app-surface-light); color: var(--app-text-dim); }

        .prize-amount {
            font-size: 24px;
            font-weight: 900;
            display: block;
        }

        /* --- Content Sections --- */
        .details-section {
            padding: 32px 0;
            border-top: 1px solid var(--glass-border);
        }

        .details-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--app-text);
        }

        .details-body {
            font-size: 16px;
            color: var(--app-text-dim);
            line-height: 1.8;
            white-space: pre-line;
        }

        /* --- Sticky Footer --- */
        .footer-action {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 450px;
            z-index: 1000;
        }

        .cta-btn {
            background: var(--app-accent);
            color: black;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 70px;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 20px 40px var(--app-accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(57, 255, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); }
        }

        .cta-btn:hover {
            transform: translateY(-5px) scale(1.02);
            filter: brightness(1.1);
        }

        /* --- Loading & States --- */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--app-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid var(--app-surface-light);
            border-top-color: var(--app-accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .hero-banner { height: 50vh; }
            .challenge-title { font-size: 32px; }
            .main-card { padding: 32px 24px; border-radius: 32px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <div id="loading-overlay">
        <div class="loader"></div>
        <p style="font-weight: 600; color: var(--app-text-dim);">Loading Details...</p>
    </div>

    <div id="main-content" style="display: none;">
        <header class="hero-banner">
            <img id="banner-img" src="" class="banner-img" alt="Banner">
            <div class="banner-overlay"></div>
            
            <div class="top-nav">
                <a href="/challenges.html" class="back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <div id="share-btn" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                </div>
            </div>
        </header>

        <main class="content-wrapper">
            <div class="main-card">
                <div class="header-info">
                    <div class="tag-row">
                        <span id="badge-category" class="badge badge-accent">Challenge</span>
                        <span id="badge-hub" class="badge badge-glass">C2 Club</span>
                    </div>
                    <h1 id="title" class="challenge-title">Loading...</h1>
                    <p id="tagline" class="challenge-tagline"></p>
                </div>

                <!-- Timer & Quick Stats -->
                <div class="stats-grid">
                    <div class="timer-box">
                        <span id="timer-label" class="timer-label">CLOSING IN</span>
                        <div class="timer-values">
                            <div class="time-unit"><span id="days" class="time-val">00</span><span class="time-label">d</span></div>
                            <div class="time-unit"><span id="hours" class="time-val">00</span><span class="time-label">h</span></div>
                            <div class="time-unit"><span id="mins" class="time-val">00</span><span class="time-label">m</span></div>
                        </div>
                    </div>
                    <div id="total-pool" class="timer-box" style="text-align: right; display:none;">
                        <span class="timer-label">TOTAL POOL</span>
                        <span id="pool-val" class="time-val" style="color: var(--app-accent); font-size: 32px;">₹0</span>
                    </div>
                </div>

                <!-- Prizes -->
                <section id="prizes-section" class="prize-section" style="display: none;">
                    <div class="section-header">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--app-accent)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        <h3>Prizes & Rewards</h3>
                    </div>
                    <div id="prizes-list" class="prizes-container"></div>
                </section>

                <!-- Dynamic Sections -->
                <div id="sections-container"></div>
            </div>
        </main>
    </div>

    <div class="footer-action">
        <a id="participate-btn" href="https://play.google.com/store/apps/details?id=com.c2club.uniqueapp" class="cta-btn">
            <span>Participate in App</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: 'AIzaSyAzp97MbDWUeovlocMTrES82p3I0lN1y70',
            appId: '1:218086364023:web:a6b8f49fa50d530dc74772',
            messagingSenderId: '218086364023',
            projectId: 'c2club-fd6722',
            authDomain: 'c2club-fd6722.firebaseapp.com',
            storageBucket: 'c2club-fd6722.firebasestorage.app',
            measurementId: 'G-VZQ02GZRL8',
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getChallengeId() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('id')) return params.get('id');

            const segments = window.location.pathname.split('/').filter(s => s.length > 0);
            const exclusions = ['challenge', 'challenge-view', 'challenges'];
            
            // Look for segments that look like Firebase IDs (long alphanumeric)
            const id = segments.find(s => !exclusions.includes(s.replace('.html','')) && s.length > 15);
            return id ? id.replace('.html', '') : null;
        }

        async function init() {
            const id = getChallengeId();
            if (!id) { showFatalError("No Challenge ID detected."); return; }

            try {
                const snap = await getDoc(doc(db, "challenges", id));
                if (snap.exists()) { render(id, snap.data()); }
                else { throw "Challenge missing in Firestore"; }
            } catch (e) {
                console.warn("Firestore failed, fallback to JSON...", e);
                try {
                    const res = await fetch('/challenges.json');
                    const data = await res.json();
                    const c = data.find(x => x.id === id);
                    if (c) render(id, c);
                    else throw "ID not in JSON";
                } catch (err) { showFatalError("Failed to fetch challenge data."); }
            }
        }

        function render(id, data) {
            document.title = `${data.title} | C2 Club`;
            
            // Media
            if (data.bannerUrl) document.getElementById('banner-img').src = data.bannerUrl;
            
            // Content
            document.getElementById('title').textContent = data.title;
            document.getElementById('tagline').textContent = data.tagline || data.overview?.substring(0, 100) + '...';
            document.getElementById('badge-category').textContent = data.category || 'Challenge';
            
            // Prize Pool
            if (data.totalPrizePool) {
                document.getElementById('total-pool').style.display = 'block';
                document.getElementById('pool-val').textContent = `₹${data.totalPrizePool}`;
            }

            // Prizes List
            const prizes = data.prizes || [];
            if (prizes.length > 0) {
                const list = document.getElementById('prizes-list');
                document.getElementById('prizes-section').style.display = 'block';
                prizes.forEach(p => {
                    const rank = p.placement?.toLowerCase() || '';
                    let cls = 'rank-other';
                    if (rank.includes('1')) cls = 'rank-1';
                    else if (rank.includes('2')) cls = 'rank-2';
                    else if (rank.includes('3')) cls = 'rank-3';

                    const div = document.createElement('div');
                    div.className = 'prize-card';
                    div.innerHTML = `
                        <span class="prize-rank ${cls}">${p.placement}</span>
                        <span class="prize-amount">${p.reward}</span>
                    `;
                    list.appendChild(div);
                });
            }

            // Sections
            const container = document.getElementById('sections-container');
            const sections = data.sections || [];
            sections.forEach(s => {
                const div = document.createElement('div');
                div.className = 'details-section';
                div.innerHTML = `
                    <h4 class="details-title">${s.title}</h4>
                    <div class="details-body">${s.content}</div>
                `;
                container.appendChild(div);
            });

            // Timer
            updateTimer(data);
            setInterval(() => updateTimer(data), 60000);

            // Finish
            document.getElementById('loading-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }, 300);
        }

        function updateTimer(data) {
            const parse = (d) => d?.toDate ? d.toDate() : (d?.seconds ? new Date(d.seconds * 1000) : new Date(d));
            const now = new Date();
            const start = parse(data.startTime);
            const end = parse(data.submissionEndTime);
            
            let target = end, label = "CLOSING IN";
            if (now < start) { target = start; label = "STARTS IN"; }
            else if (now > end) { label = "CHALLENGE ENDED"; target = null; }

            document.getElementById('timer-label').textContent = label;
            if (target) {
                const diff = target - now;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                document.getElementById('days').textContent = d.toString().padStart(2, '0');
                document.getElementById('hours').textContent = h.toString().padStart(2, '0');
                document.getElementById('mins').textContent = m.toString().padStart(2, '0');
            } else {
                document.getElementById('participate-btn').innerHTML = `
                    <span>Participate & Win Rewards</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                `;
            }
        }

        function showFatalError(msg) {
            document.getElementById('loading-overlay').innerHTML = `
                <div style="text-align:center; padding:40px;">
                    <p style="color:#ff4444; font-weight:800;">${msg}</p>
                    <a href="/challenges" style="color:var(--app-accent); text-decoration:none; margin-top:20px; display:block;">Return to Challenges</a>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
