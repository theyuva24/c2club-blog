<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Challenges | C2 Club</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --app-bg: #0a0a0a;
            --app-surface: #141414;
            --app-accent: #39FF14;
            --app-text: #ffffff;
            --app-text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            background-color: var(--app-bg);
            color: var(--app-text);
        }

        .challenges-hero {
            padding: 80px 20px 40px;
            text-align: center;
        }

        .challenges-hero h1 {
            color: white;
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 10px;
        }

        .challenges-hero p {
            color: var(--app-text-dim);
            max-width: 600px;
            margin: 0 auto;
        }

        .challenges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .challenge-card {
            background: var(--app-surface);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s, border-color 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .challenge-card:hover {
            transform: translateY(-8px);
            border-color: var(--app-accent);
        }

        .card-banner {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #222;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-tag {
            font-size: 10px;
            font-weight: 900;
            color: var(--app-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .card-excerpt {
            font-size: 14px;
            color: var(--app-text-dim);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }

        .status-active { background: rgba(57, 255, 20, 0.2); color: var(--app-accent); }

        #loading-state {
            text-align: center;
            padding: 100px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--app-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>

    <header class="navbar" style="background: var(--app-bg); border-bottom-color: rgba(255,255,255,0.05);">
        <div class="container nav-container">
            <div class="logo">
                <a href="/" style="color: white;">C2 Club</a>
            </div>
            <nav class="nav-links">
                <a href="/blog/index.html" class="nav-link" style="color: white;">Blog</a>
                <a href="/challenges.html" class="nav-link" style="color: var(--app-accent);">Challenges</a>
                <a href="/contact.html" class="nav-link" style="color: white;">Contact</a>
                <a href="/download.html" class="btn btn-primary nav-btn">Download</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="challenges-hero">
            <h1>Challenges</h1>
            <p>Compete with students across India, showcase your skills, and win exclusive rewards.</p>
        </section>

        <div id="loading-state">
            <div class="spinner"></div>
            <p>Fetching active challenges...</p>
        </div>

        <div class="challenges-grid" id="challenges-grid" style="display: none;">
            <!-- Challenge cards will be injected here -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: 'AIzaSyAzp97MbDWUeovlocMTrES82p3I0lN1y70',
            appId: '1:218086364023:web:a6b8f49fa50d530dc74772',
            messagingSenderId: '218086364023',
            projectId: 'c2club-fd6722',
            authDomain: 'c2club-fd6722.firebaseapp.com',
            storageBucket: 'c2club-fd6722.firebasestorage.app',
            measurementId: 'G-VZQ02GZRL8',
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadChallenges() {
            try {
                // 1. Try Firestore First
                const q = query(collection(db, "challenges"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const grid = document.getElementById('challenges-grid');
                    const loading = document.getElementById('loading-state');
                    querySnapshot.forEach((doc) => {
                        renderCard(doc.id, doc.data(), grid);
                    });
                    loading.style.display = 'none';
                    grid.style.display = 'grid';
                    return;
                }
            } catch (error) {
                console.warn("Firestore access failed (Check your Security Rules). Trying fallback JSON...", error);
            }

            // 2. Fallback to challenges.json
            try {
                const response = await fetch('challenges.json');
                const data = await response.json();
                const grid = document.getElementById('challenges-grid');
                const loading = document.getElementById('loading-state');
                
                data.forEach(item => {
                    renderCard(item.id, item, grid);
                });
                loading.style.display = 'none';
                grid.style.display = 'grid';
            } catch (jsonError) {
                console.error("JSON fallback failed:", jsonError);
                document.getElementById('loading-state').innerHTML = "<p style='color:red'>Failed to load challenges. Please check Firebase rules or challenges.json</p>";
            }
        }

        function renderCard(id, data, grid) {
            const card = document.createElement('a');
            card.className = 'challenge-card';
            
            // Smart Link: Use Pretty URLs only on production, otherwise use a unique filename for local testing
            const isProduction = window.location.hostname === 'c2club.in' || window.location.hostname === 'www.c2club.in';
            // We use /challenge-view?id= (without .html) to stop npx serve from 301 redirecting and losing the ID
            const target = isProduction ? `/challenge/${id}` : `${window.location.origin}/challenge-view?id=${id}`;
            
            card.href = target;
            console.log(`🔗 LINK_GEN: ID=[${id}] Target=[${target}] isProduction=[${isProduction}]`);
            
            const now = new Date();
            // Handle both Firestore Timestamps and JSON Date strings
            const end = data.submissionEndTime?.toDate ? data.submissionEndTime.toDate() : new Date(data.submissionEndTime);
            const isActive = end ? now < end : true;

            card.innerHTML = `
                <img src="${data.bannerUrl || 'preview.jpg'}" class="card-banner" alt="${data.title}">
                <div class="card-content">
                    <span class="card-tag">${data.category || 'Competiton'}</span>
                    <h2 class="card-title">${data.title}</h2>
                    <p class="card-excerpt">${data.tagline || data.overview || ''}</p>
                    <div class="card-footer">
                        <span class="status-badge ${isActive ? 'status-active' : ''}">
                            ${isActive ? 'Active' : 'Ended'}
                        </span>
                        <span style="font-size: 12px; color: var(--app-accent); font-weight: 700;">View Details &rarr;</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        }

        loadChallenges();
    </script>
</body>

</html>
